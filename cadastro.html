<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FleetCare – Cadastro</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body>
  <div class="auth-bg">
    <div class="auth-bg-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
    </div>
    <div class="auth-card auth-card-wide">
      <div class="auth-logo">
        <div class="auth-logo-icon">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 38 L12 26 L20 22 L44 22 L52 26 L56 38 L56 44 L8 44 Z" fill="white" opacity="0.95"/>
            <path d="M19 26 L22 22 L42 22 L45 26 Z" fill="#1a6b78" opacity="0.6"/>
            <rect x="22" y="23" width="8" height="3" rx="1" fill="#1a6b78" opacity="0.5"/>
            <rect x="34" y="23" width="8" height="3" rx="1" fill="#1a6b78" opacity="0.5"/>
            <circle cx="18" cy="44" r="7" fill="#0d3d47"/>
            <circle cx="18" cy="44" r="3.5" fill="white" opacity="0.7"/>
            <circle cx="46" cy="44" r="7" fill="#0d3d47"/>
            <circle cx="46" cy="44" r="3.5" fill="white" opacity="0.7"/>
            <g transform="translate(38,8) scale(0.55)">
              <circle cx="14" cy="14" r="5" fill="white" opacity="0.9"/>
              <path d="M14 4 L15.5 8.5 L18 7 L17 10.5 L21 11 L18.5 14 L21 17 L17 17.5 L18 21 L15.5 19.5 L14 24 L12.5 19.5 L10 21 L11 17.5 L7 17 L9.5 14 L7 11 L11 10.5 L10 7 L12.5 8.5 Z" fill="white" opacity="0.9"/>
            </g>
          </svg>
        </div>
        <div>
          <div class="auth-logo-name">FleetCare</div>
          <div class="auth-logo-sub">Controle de Manutenção</div>
        </div>
      </div>

      <div class="auth-header">
        <h1 class="auth-title">Criar conta</h1>
        <p class="auth-desc">Preencha os dados abaixo para criar seu acesso ao sistema</p>
      </div>

      <div class="auth-form">
        <div class="form-grid-2">
          <div class="form-group form-span-2">
            <label class="form-label">Nome completo</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
              <input type="text" class="form-input" id="cadNome" placeholder="Ex: João da Silva" autocomplete="name"/>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Usuário</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
              </span>
              <input type="text" class="form-input" id="cadUsuario" placeholder="Ex: joao.silva" autocomplete="username"/>
            </div>
            <span class="form-hint">Sem espaços ou caracteres especiais</span>
          </div>
          <div class="form-group">
            <label class="form-label">E-mail <span class="form-optional">(opcional)</span></label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              </span>
              <input type="email" class="form-input" id="cadEmail" placeholder="seu@email.com" autocomplete="email"/>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Senha</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input type="password" class="form-input" id="cadSenha" placeholder="Mínimo 6 caracteres" autocomplete="new-password" oninput="checkSenhaForte()"/>
              <button type="button" class="toggle-pass" onclick="togglePass('cadSenha', this)" tabindex="-1">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="senha-forte" id="senhaForte" style="display:none">
              <div class="senha-barra"><div class="senha-barra-fill" id="senhaBarraFill"></div></div>
              <span class="senha-label" id="senhaLabel"></span>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Confirmar senha</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input type="password" class="form-input" id="cadConfirma" placeholder="Repita a senha" autocomplete="new-password"/>
              <button type="button" class="toggle-pass" onclick="togglePass('cadConfirma', this)" tabindex="-1">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div id="cadErro" class="auth-erro" style="display:none"></div>
        <div class="auth-actions auth-actions-2">
          <button type="button" class="btn-auth btn-outline-auth" onclick="voltar()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Voltar
          </button>
          <button type="button" class="btn-auth btn-primary-auth" onclick="cadastrar()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            Cadastrar
          </button>
        </div>
      </div>

      <div class="auth-footer">
        <span>Já tem conta? <a href="login.html" class="auth-link">Fazer login</a></span>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="auth.js"></script>
</body>
</html>
